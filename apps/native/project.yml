# XcodeGen spec: `cd apps/native && xcodegen` makes NativeErgonomics.xcodeproj (gitignored).
# Signing: `ALTERED_TEAM=<team id> xcodegen` fills in the team, so a regenerated project keeps it.
# Native Ergonomics (D198): stock SwiftUI on iOS 26, a local SwiftData store, no network.
name: NativeErgonomics
options:
  bundleIdPrefix: com.rileybarabash
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ${ALTERED_TEAM}
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  NativeErgonomics:
    type: application
    platform: iOS
    sources:
      - path: NativeErgonomics
    info:
      path: NativeErgonomics/Info.plist
      properties:
        CFBundleDisplayName: ALTERED Native
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rileybarabash.altered-native
        PRODUCT_NAME: NativeErgonomics
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        #  No app icon yet (the icon is a design call); XcodeGen otherwise expects one named AppIcon.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
  NativeErgonomicsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NativeErgonomicsTests]
    dependencies:
      - target: NativeErgonomics
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.rileybarabash.altered-native.tests
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
  NativeErgonomicsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [NativeErgonomicsUITests]
    dependencies:
      - target: NativeErgonomics
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.rileybarabash.altered-native.uitests
        TEST_TARGET_NAME: NativeErgonomics
schemes:
  NativeErgonomics:
    build:
      targets:
        NativeErgonomics: all
        NativeErgonomicsTests: [test]
        NativeErgonomicsUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [NativeErgonomicsTests, NativeErgonomicsUITests]
