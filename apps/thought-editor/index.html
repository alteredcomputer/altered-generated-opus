<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <!--
            viewport-fit=cover lets the page run under the iPhone's corners and pad itself with
            env(safe-area-inset-*); maximum-scale=1 stops the zoom when an input takes focus
            (pinch zoom still works on iOS).
        -->
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
        />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="robots" content="noindex, nofollow" />
        <meta name="theme-color" content="#101010" />
        <link rel="icon" href="/icon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="/icon-192.png" />
        <title>ALTERED</title>
        <!-- Painted before any script or stylesheet loads, so the first frame is never black. -->
        <style>
            html,
            body {
                background: #101010;
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
