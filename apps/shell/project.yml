# XcodeGen spec: `cd apps/shell && xcodegen` makes AlteredShell.xcodeproj (gitignored).
# Signing: `ALTERED_TEAM=<team id> xcodegen` fills in the team, so a regenerated project keeps it.
# One multiplatform target, one WKWebView on the hosted thought editor (D175).
name: AlteredShell
options:
  bundleIdPrefix: com.rileybarabash
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ${ALTERED_TEAM}
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  AlteredShell:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Shell
    info:
      path: Shell/Info.plist
      properties:
        CFBundleDisplayName: ALTERED
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchScreen:
          UIColorName: Background
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rileybarabash.altered-shell
        PRODUCT_NAME: ALTERED
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Shell/Mac.entitlements
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG $(inherited)
schemes:
  AlteredShell:
    build:
      targets:
        AlteredShell: all
    run:
      config: Debug
      environmentVariables:
        #  Debug only: point the shell at a dev server. Enable it in the scheme editor
        #  (Product, Scheme, Edit Scheme, Run, Arguments) and put in the Mac's address.
        - variable: ALTERED_SHELL_URL
          value: http://<mac-ip>:5173
          isEnabled: false
    archive:
      config: Release
