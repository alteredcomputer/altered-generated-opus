name: check

on:
    push:
        branches: ["**"]

concurrency:
    group: check-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  #  The graph's coverage check reads the file list from git, so it needs the tree.
                  fetch-depth: 1

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - run: pnpm run check

            - run: pnpm run build
